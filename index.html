<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<script>/* iPhone 防放大（全 App 統一，主任 2026-10-17）：iPhone／iPad 點輸入框不自動放大，兩指放大照常；Android 不加 maximum-scale（會連兩指放大都鎖掉） */
(function(){var m=document.querySelector('meta[name=viewport]');if(m&&(/iP(hone|ad|od)/.test(navigator.userAgent)||(navigator.platform==='MacIntel'&&navigator.maxTouchPoints>1))&&m.content.indexOf('maximum-scale')<0)m.content+=',maximum-scale=1';})();</script>
<style>html,body,*{touch-action:manipulation}/* 連點兩下不放大，兩指放大照常 */</style>
<title>天晟急診教學</title>
<meta name="description" content="天晟醫院急診部教學平台：教材、線上測驗、臨床快查">
<meta name="theme-color" content="#0d9488">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/favicon-32.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="急診教學">
<style>
:root{
  --brand:#0d9488; --brand-d:#0f766e; --brand-l:#ccfbf1;
  --bg:#f1f5f9; --card:#fff; --ink:#0f172a; --ink2:#475569; --ink3:#94a3b8;
  --line:#e2e8f0; --ok:#059669; --ok-bg:#ecfdf5; --warn:#dc2626; --warn-bg:#fef2f2;
  --shadow:0 1px 3px rgba(15,23,42,.08),0 1px 2px rgba(15,23,42,.04);
  --nav-h:calc(58px + env(safe-area-inset-bottom));
}
@media (prefers-color-scheme:dark){
  :root{
    --bg:#0b1220; --card:#151f31; --ink:#e8eef7; --ink2:#a3b2c7; --ink3:#64748b;
    --line:#25324a; --brand-l:#0d3b37; --ok-bg:#0c2a22; --warn-bg:#3a1414;
    --shadow:0 1px 3px rgba(0,0,0,.4);
  }
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
[hidden]{display:none!important}   /* 避免下方 .iconbtn 的 display 蓋掉 hidden */
html,body{margin:0;padding:0}
body{
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans TC","PingFang TC","Microsoft JhengHei",sans-serif;
  background:var(--bg); color:var(--ink); line-height:1.75; font-size:16px;
  padding-bottom:var(--nav-h); -webkit-text-size-adjust:100%;
}
button{font:inherit;color:inherit;cursor:pointer}
a{color:var(--brand)}

/* ---------- 頂欄 ---------- */
header{
  position:sticky; top:0; z-index:50; background:var(--brand);
  color:#fff; padding:env(safe-area-inset-top) 0 0;
}
.hbar{display:flex;align-items:center;gap:10px;padding:11px 14px;min-height:52px}
.hbar h1{font-size:17px;margin:0;font-weight:700;letter-spacing:.5px;flex:1;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.hbar .sub{font-size:11px;opacity:.8;font-weight:400;margin-left:2px}
.iconbtn{background:rgba(255,255,255,.16);border:0;border-radius:9px;color:#fff;
  width:34px;height:34px;display:grid;place-items:center;font-size:17px;flex:none}
.iconbtn:active{background:rgba(255,255,255,.32)}

/* ---------- 版面 ---------- */
.wrap{max-width:820px;margin:0 auto;padding:14px 14px 28px}
.view{display:none} .view.on{display:block}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;
  box-shadow:var(--shadow);margin-bottom:12px;overflow:hidden}
.card-pad{padding:14px 16px}
h2.sec{font-size:13px;color:var(--ink2);margin:20px 4px 8px;font-weight:700;letter-spacing:.6px}
.muted{color:var(--ink2);font-size:14px}
.tiny{font-size:12px;color:var(--ink3)}

/* ---------- 課程／章節列 ---------- */
.cat-head{display:flex;align-items:center;gap:12px;padding:14px 16px;border-bottom:1px solid var(--line)}
.cat-ico{font-size:26px;width:44px;height:44px;display:grid;place-items:center;
  background:var(--brand-l);border-radius:12px;flex:none}
.cat-t{font-weight:700;font-size:16px}
.cat-d{font-size:12.5px;color:var(--ink2);line-height:1.5}
.row{display:flex;align-items:center;gap:12px;padding:12px 16px;width:100%;
  background:none;border:0;border-top:1px solid var(--line);text-align:left}
.row:first-child{border-top:0}
.row:active{background:var(--brand-l)}
.row .dot{width:22px;height:22px;border-radius:50%;border:2px solid var(--line);flex:none;
  display:grid;place-items:center;font-size:12px;color:#fff}
.row .dot.done{background:var(--ok);border-color:var(--ok)}
.row .t{flex:1;min-width:0}
.row .t b{display:block;font-weight:600;font-size:15px}
.row .t span{font-size:12px;color:var(--ink3)}
.row .arrow{color:var(--ink3);font-size:18px;flex:none}

/* ---------- 進度條 ---------- */
.bar{height:8px;background:var(--line);border-radius:99px;overflow:hidden}
.bar>i{display:block;height:100%;background:var(--brand);border-radius:99px;transition:width .4s}
.pct{font-size:26px;font-weight:800;color:var(--brand)}

/* ---------- 章節內容 ---------- */
.reader h3{font-size:16px;margin:26px 0 8px;padding-left:11px;border-left:4px solid var(--brand);
  line-height:1.5}
.reader h3:first-child{margin-top:6px}
.reader p{margin:10px 0}
.reader ul,.reader ol{margin:10px 0;padding-left:22px}
.reader li{margin:6px 0}
.box{border-radius:12px;padding:12px 14px;margin:14px 0;font-size:15px}
.box b.bt{display:block;font-size:13px;margin-bottom:6px;letter-spacing:.5px}
.box ul{margin:4px 0;padding-left:20px}
.box.key{background:var(--ok-bg);border:1px solid rgba(5,150,105,.3)}
.box.key b.bt{color:var(--ok)}
.box.warn{background:var(--warn-bg);border:1px solid rgba(220,38,38,.3)}
.box.warn b.bt{color:var(--warn)}
.tbl-wrap{overflow-x:auto;margin:14px 0;border:1px solid var(--line);border-radius:12px}
table{border-collapse:collapse;width:100%;font-size:14px;min-width:340px}
th,td{padding:9px 11px;text-align:left;border-bottom:1px solid var(--line);vertical-align:top;
  min-width:76px}   /* 欄位不被壓成一字一行；擠不下時由外層容器橫向捲動 */
th{background:var(--brand-l);font-weight:700;font-size:13px;white-space:nowrap}
tr:last-child td{border-bottom:0}
.vid{position:relative;padding-bottom:56.25%;height:0;border-radius:12px;overflow:hidden;margin:14px 0;background:#000}
.vid iframe{position:absolute;inset:0;width:100%;height:100%;border:0}
.reader img{max-width:100%;border-radius:12px;margin:14px 0;display:block}
.cap{font-size:12px;color:var(--ink3);text-align:center;margin-top:-8px}
.filelink{display:flex;align-items:center;gap:10px;padding:12px 14px;border:1px solid var(--line);
  border-radius:12px;text-decoration:none;color:var(--ink);margin:14px 0;background:var(--card)}

/* ---------- 按鈕 ---------- */
.btn{display:block;width:100%;padding:13px;border-radius:12px;border:0;font-weight:700;
  background:var(--brand);color:#fff;font-size:15px;margin:10px 0}
.btn:active{background:var(--brand-d)}
.btn.ghost{background:var(--card);color:var(--brand);border:1.5px solid var(--brand)}
.btn.gray{background:var(--card);color:var(--ink2);border:1.5px solid var(--line)}
.btn.sm{padding:9px;font-size:14px}
.btn[disabled]{opacity:.45}
.btn-row{display:flex;gap:10px}.btn-row .btn{margin:10px 0}

/* ---------- 測驗 ---------- */
.qnum{font-size:12px;color:var(--ink3);letter-spacing:1px}
.qtext{font-size:17px;font-weight:600;line-height:1.65;margin:8px 0 16px}
.opt{display:flex;gap:11px;align-items:flex-start;width:100%;text-align:left;background:var(--card);
  border:1.5px solid var(--line);border-radius:12px;padding:12px 14px;margin-bottom:9px;font-size:15px}
.opt .lt{font-weight:700;color:var(--ink3);flex:none;width:20px}
.opt.sel{border-color:var(--brand);background:var(--brand-l)}
.opt.right{border-color:var(--ok);background:var(--ok-bg)}
.opt.right .lt{color:var(--ok)}
.opt.wrong{border-color:var(--warn);background:var(--warn-bg)}
.opt.wrong .lt{color:var(--warn)}
.opt[disabled]{opacity:1}
.ex{border-left:4px solid var(--brand);background:var(--brand-l);padding:11px 13px;
  border-radius:0 10px 10px 0;font-size:14.5px;margin:14px 0}
.score{font-size:48px;font-weight:800;text-align:center;color:var(--brand);line-height:1.1}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin:10px 0}
.chip{padding:7px 13px;border-radius:99px;border:1.5px solid var(--line);background:var(--card);
  font-size:13.5px;white-space:nowrap}
.chip.on{background:var(--brand);border-color:var(--brand);color:#fff;font-weight:600}

/* ---------- 搜尋 ---------- */
.search{width:100%;padding:12px 14px;border-radius:12px;border:1.5px solid var(--line);
  background:var(--card);color:var(--ink);font-size:16px}
.search:focus{outline:none;border-color:var(--brand)}

/* ---------- 底部導覽 ---------- */
nav{position:fixed;left:0;right:0;bottom:0;z-index:60;background:var(--card);
  border-top:1px solid var(--line);display:flex;padding-bottom:env(safe-area-inset-bottom)}
nav button{flex:1;background:none;border:0;padding:7px 0 6px;display:flex;flex-direction:column;
  align-items:center;gap:2px;color:var(--ink3);font-size:11px}
nav button i{font-style:normal;font-size:21px;line-height:1.15}
nav button.on{color:var(--brand);font-weight:700}

/* ---------- 其他 ---------- */
.toast{position:fixed;left:50%;bottom:calc(var(--nav-h) + 16px);transform:translateX(-50%) translateY(20px);
  background:var(--ink);color:var(--bg);padding:11px 20px;border-radius:99px;font-size:14px;
  opacity:0;transition:.25s;z-index:90;pointer-events:none;max-width:90vw;text-align:center}
.toast.on{opacity:.96;transform:translateX(-50%) translateY(0)}
.disclaimer{font-size:11.5px;color:var(--ink3);line-height:1.6;padding:14px 6px 4px;text-align:center}
.empty{text-align:center;color:var(--ink3);padding:40px 20px;font-size:14px}
.badge{display:inline-block;font-size:11px;padding:2px 8px;border-radius:99px;
  background:var(--brand-l);color:var(--brand-d);font-weight:600;margin-left:6px}
@media (prefers-color-scheme:dark){.badge{color:#5eead4}}
@media print{header,nav,.noprint{display:none!important}body{padding:0;background:#fff}}
</style>
</head>
<body>

<header>
  <div class="hbar">
    <button class="iconbtn" id="backBtn" hidden onclick="goBack()">←</button>
    <h1 id="title">天晟急診教學<span class="sub">Tenchen ER</span></h1>
    <button class="iconbtn" id="installBtn" hidden onclick="doInstall()" title="安裝到主畫面">⬇</button>
  </div>
</header>

<div class="wrap">

  <!-- ============ 教材 ============ -->
  <section class="view on" id="v-learn"><div id="learnBody"></div></section>

  <!-- ============ 測驗 ============ -->
  <section class="view" id="v-quiz"><div id="quizBody"></div></section>

  <!-- ============ 快查 ============ -->
  <section class="view" id="v-ref"><div id="refBody"></div></section>

  <!-- ============ 我的 ============ -->
  <section class="view" id="v-me"><div id="meBody"></div></section>

</div>

<nav>
  <button class="on" data-tab="learn" onclick="tab('learn')"><i>📚</i>教材</button>
  <button data-tab="quiz" onclick="tab('quiz')"><i>✍️</i>測驗</button>
  <button data-tab="ref" onclick="tab('ref')"><i>⚡</i>快查</button>
  <button data-tab="me" onclick="tab('me')"><i>👤</i>我的</button>
</nav>

<div class="toast" id="toast"></div>

<script src="data/courses.js"></script>
<script src="data/quiz.js"></script>
<script src="data/quickref.js"></script>
<script>
/* =====================================================================
   天晟急診教學 — 應用程式邏輯
   資料全部存在本機 localStorage，不上傳、不含個人資料。
   ===================================================================== */
'use strict';

const LS_KEY = 'erEduProgress_v1';
const PASS = 80;               // 測驗及格分數(%)

/* ---------- 進度儲存 ---------- */
const blank = () => ({ name:'', read:{}, quiz:{}, wrong:{}, log:[] });
let P = blank();
try {
  const raw = localStorage.getItem(LS_KEY);
  if (raw) P = Object.assign(blank(), JSON.parse(raw));
} catch(e) { console.warn('讀取進度失敗，改用空白進度', e); }
function save(){ try{ localStorage.setItem(LS_KEY, JSON.stringify(P)); }catch(e){ toast('無法儲存進度（瀏覽器儲存空間已滿或為私密模式）'); } }

/* ---------- 小工具 ---------- */
const $  = s => document.querySelector(s);
const esc = s => String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
/* 內文標記：**粗體** 與 `程式碼樣式` */
const md = s => esc(s).replace(/\*\*(.+?)\*\*/g,'<strong>$1</strong>').replace(/`(.+?)`/g,'<code>$1</code>');
const allChapters = () => COURSES.flatMap(c => c.chapters.map(ch => ({...ch, cat:c.title, catId:c.id})));
const chapterById = id => allChapters().find(c => c.id === id);
const qOf = chId => QUIZ.filter(q => q.ch === chId);
const fmtDate = ts => { const d = new Date(ts); return `${d.getFullYear()}/${d.getMonth()+1}/${d.getDate()}`; };

let toastTimer = null;
function toast(msg){
  const t = $('#toast'); t.textContent = msg; t.classList.add('on');
  clearTimeout(toastTimer); toastTimer = setTimeout(()=>t.classList.remove('on'), 2200);
}

/* ---------- 內容區塊渲染（教材與快查共用） ---------- */
function renderBlocks(blocks){
  return (blocks||[]).map(b => {
    switch(b.t){
      case 'h':  return `<h3>${md(b.x)}</h3>`;
      case 'p':  return `<p>${md(b.x)}</p>`;
      case 'ul': return `<ul>${b.x.map(i=>`<li>${md(i)}</li>`).join('')}</ul>`;
      case 'steps': return `<ol>${b.x.map(i=>`<li>${md(i)}</li>`).join('')}</ol>`;
      case 'key':  return `<div class="box key"><b class="bt">${md(b.title||'重點')}</b><ul>${b.x.map(i=>`<li>${md(i)}</li>`).join('')}</ul></div>`;
      case 'warn': return `<div class="box warn"><b class="bt">⚠ ${md(b.title||'注意')}</b><ul>${b.x.map(i=>`<li>${md(i)}</li>`).join('')}</ul></div>`;
      case 'table': return `<div class="tbl-wrap"><table><thead><tr>${b.head.map(h=>`<th>${md(h)}</th>`).join('')}</tr></thead>`
        + `<tbody>${b.rows.map(r=>`<tr>${r.map(c=>`<td>${md(c)}</td>`).join('')}</tr>`).join('')}</tbody></table></div>`;
      case 'video': return `<div class="vid"><iframe src="https://www.youtube-nocookie.com/embed/${encodeURIComponent(b.id)}" `
        + `title="教學影片" allow="accelerometer;autoplay;clipboard-write;encrypted-media;gyroscope;picture-in-picture" allowfullscreen loading="lazy"></iframe></div>`
        + (b.x ? `<div class="cap">${md(b.x)}</div>` : '');
      case 'img': return `<img src="${esc(b.src)}" alt="${esc(b.x||'')}" loading="lazy">` + (b.x?`<div class="cap">${md(b.x)}</div>`:'');
      case 'pdf': return `<a class="filelink" href="${esc(b.href)}" target="_blank" rel="noopener"><span style="font-size:22px">📄</span><span>${md(b.x||'下載檔案')}</span></a>`;
      default: return '';
    }
  }).join('');
}

/* =====================================================================
   分頁切換
   ===================================================================== */
let cur = 'learn';
const stack = [];                       // 返回堆疊
const HOME = { learn:()=>drawLearn(), quiz:()=>drawQuizHome(), ref:()=>drawRef(), me:()=>drawMe() };

/* 只切換顯示的分頁，不清空堆疊、不重畫 */
function showTab(name){
  cur = name;
  document.querySelectorAll('.view').forEach(v => v.classList.toggle('on', v.id === 'v-'+name));
  document.querySelectorAll('nav button').forEach(b => b.classList.toggle('on', b.dataset.tab === name));
}
/* 點底部導覽：回到該分頁首頁 */
function tab(name){
  showTab(name);
  stack.length = 0;
  HOME[name]();
  window.scrollTo(0,0);
  syncHeader();
}
function syncHeader(){
  $('#backBtn').hidden = stack.length === 0;
  $('#title').innerHTML = stack.length
    ? esc(stack[stack.length-1].title)
    : '天晟急診教學<span class="sub">Tenchen ER</span>';
}
function push(title, drawFn, tabName){
  const t = tabName || cur;
  stack.push({ title, draw:drawFn, tab:t });
  showTab(t); drawFn(); window.scrollTo(0,0); syncHeader();
}
function goBack(){
  const gone = stack.pop();
  if (stack.length){ const top = stack[stack.length-1]; showTab(top.tab); top.draw(); }
  else { const t = (gone && gone.tab) || cur; showTab(t); HOME[t](); }
  window.scrollTo(0,0); syncHeader();
}

/* =====================================================================
   一、教材
   ===================================================================== */
function drawLearn(){
  const chs = allChapters();
  const done = chs.filter(c => P.read[c.id]).length;
  const pct = chs.length ? Math.round(done/chs.length*100) : 0;

  let h = `<div class="card card-pad">
      <div style="display:flex;align-items:center;gap:14px">
        <div><div class="pct">${pct}%</div><div class="tiny">已完成</div></div>
        <div style="flex:1">
          <div style="display:flex;justify-content:space-between;font-size:13px;margin-bottom:6px">
            <b>學習進度</b><span class="muted">${done} / ${chs.length} 章</span></div>
          <div class="bar"><i style="width:${pct}%"></i></div>
        </div>
      </div></div>`;

  COURSES.forEach(cat => {
    const d = cat.chapters.filter(c => P.read[c.id]).length;
    h += `<div class="card">
      <div class="cat-head">
        <div class="cat-ico">${cat.icon}</div>
        <div style="flex:1;min-width:0">
          <div class="cat-t">${esc(cat.title)} <span class="badge">${d}/${cat.chapters.length}</span></div>
          <div class="cat-d">${esc(cat.desc)}</div>
        </div>
      </div>` +
      cat.chapters.map(ch => `
        <button class="row" onclick="openChapter('${ch.id}')">
          <span class="dot ${P.read[ch.id]?'done':''}">${P.read[ch.id]?'✓':''}</span>
          <span class="t"><b>${esc(ch.title)}</b>
            <span>約 ${ch.min} 分鐘${qOf(ch.id).length?` · ${qOf(ch.id).length} 題測驗`:''}</span></span>
          <span class="arrow">›</span>
        </button>`).join('') + `</div>`;
  });

  h += `<div class="disclaimer">本平台內容為天晟醫院急診部**院內教學**用途，整理自現行急救指引。<br>
        實際臨床處置與藥物劑量，一律以醫囑與院內最新規範為準。</div>`;
  $('#learnBody').innerHTML = h.replace(/\*\*(.+?)\*\*/g,'<b>$1</b>');
}

function openChapter(id){
  const ch = chapterById(id);
  if (!ch) return;
  const draw = () => {
    const isDone = !!P.read[id];
    const nq = qOf(id).length;
    $('#learnBody').innerHTML = `
      <div class="card card-pad reader">
        <div class="tiny">${esc(ch.cat)}</div>
        <h2 style="font-size:20px;margin:4px 0 2px">${esc(ch.title)}</h2>
        <div class="tiny" style="margin-bottom:10px">約 ${ch.min} 分鐘 ${ch.tags?.map(t=>'· '+esc(t)).join(' ')||''}</div>
        <hr style="border:0;border-top:1px solid var(--line);margin:0 0 6px">
        ${renderBlocks(ch.blocks)}
      </div>
      <button class="btn ${isDone?'gray':''}" onclick="toggleRead('${id}')">
        ${isDone ? `✓ 已於 ${fmtDate(P.read[id])} 讀完（點此取消）` : '標記為已讀完'}
      </button>
      ${nq ? `<button class="btn ghost" onclick="startQuiz('${id}')">開始本章測驗（${nq} 題）</button>` : ''}
      ${nextChapterBtn(id)}`;
  };
  push(ch.title, draw, 'learn');
}
function nextChapterBtn(id){
  const chs = allChapters(); const i = chs.findIndex(c=>c.id===id);
  if (i < 0 || i === chs.length-1) return '';
  const n = chs[i+1];
  return `<button class="btn gray" onclick="stack.pop();openChapter('${n.id}')">下一章：${esc(n.title)} ›</button>`;
}
function toggleRead(id){
  if (P.read[id]) { delete P.read[id]; toast('已取消標記'); }
  else { P.read[id] = Date.now(); toast('已標記為讀完 👍'); }
  save();
  stack[stack.length-1] && stack[stack.length-1].draw();
}

/* =====================================================================
   二、測驗
   ===================================================================== */
function drawQuizHome(){
  const chs = allChapters().filter(c => qOf(c.id).length);
  const wrongIds = Object.keys(P.wrong).filter(k => P.wrong[k] > 0);
  const attempts = Object.values(P.quiz);
  const avg = attempts.length ? Math.round(attempts.reduce((s,a)=>s+a.best,0)/attempts.length) : 0;

  let h = `<div class="card card-pad">
    <b>綜合測驗</b>
    <div class="muted" style="margin:4px 0 10px">從全部題庫隨機抽題，模擬完整測驗。</div>
    <div class="btn-row">
      <button class="btn" onclick="startQuiz(null,10)">隨機 10 題</button>
      <button class="btn ghost" onclick="startQuiz(null,20)">隨機 20 題</button>
    </div>
    <div class="tiny">題庫共 ${QUIZ.length} 題 · 已完成章節平均 ${avg} 分</div>
  </div>`;

  if (wrongIds.length){
    h += `<div class="card card-pad">
      <b>錯題複習 <span class="badge">${wrongIds.length} 題</span></b>
      <div class="muted" style="margin:4px 0 8px">重做曾經答錯的題目，答對後就會從清單移除。</div>
      <button class="btn ghost sm" onclick="startWrong()">開始複習</button>
    </div>`;
  }

  h += `<h2 class="sec">分章測驗</h2><div class="card">` + chs.map(c=>{
    const r = P.quiz[c.id];
    const tagCls = r ? (r.best>=PASS ? 'style="color:var(--ok);font-weight:700"' : 'style="color:var(--warn);font-weight:700"') : 'class="tiny"';
    return `<button class="row" onclick="startQuiz('${c.id}')">
      <span class="dot ${r&&r.best>=PASS?'done':''}">${r&&r.best>=PASS?'✓':''}</span>
      <span class="t"><b>${esc(c.title)}</b><span>${esc(c.cat)} · ${qOf(c.id).length} 題</span></span>
      <span ${tagCls}>${r ? r.best+'分' : '未測'}</span>
      <span class="arrow">›</span></button>`;
  }).join('') + `</div>
  <div class="disclaimer">測驗成績只儲存在你自己的手機／電腦，不會上傳。</div>`;
  $('#quizBody').innerHTML = h;
}

/* ---- 測驗流程 ---- */
let S = null;   // {list, i, picked, correct, chId, mode}
const shuffle = a => a.map(v=>[Math.random(),v]).sort((x,y)=>x[0]-y[0]).map(v=>v[1]);

function startQuiz(chId, n){
  let list = chId ? qOf(chId) : shuffle(QUIZ).slice(0, n || 10);
  if (!list.length) return toast('這個章節還沒有題目');
  S = { list: chId ? shuffle(list) : list, i:0, picked:null, correct:0, chId, mode:'normal' };
  push(chId ? chapterById(chId).title + '（測驗）' : '綜合測驗', drawQuestion, 'quiz');
}
function startWrong(){
  const ids = Object.keys(P.wrong).filter(k=>P.wrong[k]>0);
  const list = QUIZ.filter(q => ids.includes(q.id));
  if (!list.length) return toast('目前沒有錯題');
  S = { list: shuffle(list), i:0, picked:null, correct:0, chId:null, mode:'wrong' };
  push('錯題複習', drawQuestion, 'quiz');
}

function drawQuestion(){
  if (!S) return drawQuizHome();
  if (S.i >= S.list.length) return drawResult();
  const q = S.list[S.i], answered = S.picked !== null;
  const L = ['A','B','C','D','E','F'];

  $('#quizBody').innerHTML = `
    <div class="card card-pad">
      <div class="bar" style="margin-bottom:12px"><i style="width:${S.i/S.list.length*100}%"></i></div>
      <div class="qnum">第 ${S.i+1} / ${S.list.length} 題</div>
      <div class="qtext">${md(q.q)}</div>
      ${q.opts.map((o,idx)=>{
        let cls = '';
        if (answered){
          if (idx === q.a) cls = 'right';
          else if (idx === S.picked) cls = 'wrong';
        }
        return `<button class="opt ${cls}" ${answered?'disabled':''} onclick="pick(${idx})">
          <span class="lt">${L[idx]}</span><span>${md(o)}</span></button>`;
      }).join('')}
      ${answered ? `<div class="ex"><b>${S.picked===q.a?'✅ 答對了':'❌ 正確答案是 '+L[q.a]}</b><br>${md(q.ex||'')}</div>` : ''}
    </div>
    ${answered ? `<button class="btn" onclick="nextQ()">${S.i===S.list.length-1?'看結果':'下一題'} ›</button>` : ''}`;
}
function pick(idx){
  if (!S || S.picked !== null) return;
  const q = S.list[S.i];
  S.picked = idx;
  if (idx === q.a){
    S.correct++;
    if (P.wrong[q.id]) { delete P.wrong[q.id]; save(); }   // 答對即移出錯題本
  } else {
    P.wrong[q.id] = (P.wrong[q.id]||0) + 1; save();
  }
  drawQuestion();
}
function nextQ(){ S.i++; S.picked = null; drawQuestion(); window.scrollTo(0,0); }

function drawResult(){
  const total = S.list.length, score = Math.round(S.correct/total*100), pass = score >= PASS;
  if (S.chId){
    const prev = P.quiz[S.chId] || {best:0, attempts:0};
    P.quiz[S.chId] = { best: Math.max(prev.best, score), last: score, attempts: prev.attempts+1, ts: Date.now() };
  }
  P.log.unshift({ ts:Date.now(), name: S.chId ? chapterById(S.chId).title : (S.mode==='wrong'?'錯題複習':'綜合測驗'), score, total });
  P.log = P.log.slice(0, 30);
  save();

  $('#quizBody').innerHTML = `
    <div class="card card-pad" style="text-align:center">
      <div style="font-size:44px">${pass?'🎉':'💪'}</div>
      <div class="score">${score}<span style="font-size:22px">分</span></div>
      <div class="muted">答對 ${S.correct} / ${total} 題 · ${pass?`達到 ${PASS} 分及格標準`:`未達 ${PASS} 分，建議複習後再測一次`}</div>
    </div>
    ${S.chId ? `<button class="btn ghost" onclick="tab('learn');openChapter('${S.chId}')">回去複習教材</button>`:''}
    <button class="btn" onclick="stack.pop();${S.mode==='wrong'?'startWrong()':`startQuiz(${S.chId?`'${S.chId}'`:'null'},${total})`}">再測一次</button>
    <button class="btn gray" onclick="stack.length=0;tab('quiz')">回測驗首頁</button>`;
  syncHeader();
}

/* =====================================================================
   三、臨床快查
   ===================================================================== */
let refCat = '全部', refKw = '', refTyping = false;     // 記住搜尋字，看完卡片返回時不會被清掉
function drawRef(){
  const cats = ['全部', ...new Set(QUICKREF.map(r=>r.cat))];
  const box = $('#refSearch');
  if (box) refKw = box.value;
  const kw = refKw.trim().toLowerCase();
  const list = QUICKREF.filter(r =>
    (refCat === '全部' || r.cat === refCat) &&
    (!kw || (r.title+' '+r.cat+' '+(r.tags||[]).join(' ')+' '+JSON.stringify(r.body)).toLowerCase().includes(kw))
  );

  $('#refBody').innerHTML = `
    <input class="search" id="refSearch" placeholder="🔍 搜尋：劑量、流程、縮寫…" value="${esc(refKw)}" oninput="refTyping=true;drawRef()">
    <div class="chips">${cats.map(c=>`<button class="chip ${c===refCat?'on':''}" onclick="refCat='${esc(c)}';drawRef()">${esc(c)}</button>`).join('')}</div>
    ${list.length ? list.map(r=>`
      <button class="row card" style="border-top:0" onclick="openRef('${r.id}')">
        <span class="t"><b>${esc(r.title)}</b><span>${esc(r.cat)}</span></span>
        <span class="arrow">›</span></button>`).join('')
      : `<div class="empty">找不到「${esc(kw)}」<br>換個關鍵字試試</div>`}
    <div class="disclaimer">快查卡為記憶輔助，給藥前務必核對醫囑與院內藥典。</div>`;

  if (refTyping){                       // 只有在打字造成的重繪才搶回游標，避免返回時彈出鍵盤
    refTyping = false;
    const el = $('#refSearch'); el.focus(); el.setSelectionRange(el.value.length, el.value.length);
  }
}
function openRef(id){
  const r = QUICKREF.find(x=>x.id===id); if (!r) return;
  push(r.title, () => {   /* tab 用當前的 ref */
    $('#refBody').innerHTML = `<div class="card card-pad reader">
      <div class="tiny">${esc(r.cat)}</div>
      <h2 style="font-size:20px;margin:4px 0 10px">${esc(r.title)}</h2>
      ${renderBlocks(r.body)}
    </div>
    <div class="disclaimer">給藥前務必核對醫囑與院內藥典。</div>`;
  });
}

/* =====================================================================
   四、我的
   ===================================================================== */
function drawMe(){
  const chs = allChapters();
  const done = chs.filter(c=>P.read[c.id]).length;
  const pct = chs.length ? Math.round(done/chs.length*100) : 0;
  const quizzed = Object.keys(P.quiz).length;
  const passed = Object.values(P.quiz).filter(q=>q.best>=PASS).length;
  const wrongN = Object.keys(P.wrong).filter(k=>P.wrong[k]>0).length;

  $('#meBody').innerHTML = `
    <div class="card card-pad">
      <label class="tiny">姓名（只存在本機，用於列印學習紀錄）</label>
      <input class="search" id="nameIn" style="margin-top:6px" placeholder="請輸入姓名／工號"
             value="${esc(P.name||'')}" onchange="P.name=this.value.trim();save();toast('已儲存')">
    </div>

    <div class="card card-pad">
      <div style="display:flex;align-items:center;gap:14px;margin-bottom:12px">
        <div><div class="pct">${pct}%</div><div class="tiny">教材完成率</div></div>
        <div style="flex:1"><div class="bar"><i style="width:${pct}%"></i></div>
          <div class="tiny" style="margin-top:6px">${done} / ${chs.length} 章已讀完</div></div>
      </div>
      <div style="display:flex;text-align:center;border-top:1px solid var(--line);padding-top:12px">
        <div style="flex:1"><b style="font-size:20px">${quizzed}</b><div class="tiny">已測章節</div></div>
        <div style="flex:1"><b style="font-size:20px;color:var(--ok)">${passed}</b><div class="tiny">及格章節</div></div>
        <div style="flex:1"><b style="font-size:20px;color:${wrongN?'var(--warn)':'inherit'}">${wrongN}</b><div class="tiny">待複習錯題</div></div>
      </div>
    </div>

    <h2 class="sec">各章狀態</h2>
    <div class="card">${chs.map(c=>{
      const r = P.quiz[c.id];
      return `<div class="row" style="cursor:default">
        <span class="dot ${P.read[c.id]?'done':''}">${P.read[c.id]?'✓':''}</span>
        <span class="t"><b>${esc(c.title)}</b><span>${esc(c.cat)}</span></span>
        <span class="tiny" style="${r?(r.best>=PASS?'color:var(--ok)':'color:var(--warn)'):''}">${r?r.best+'分':'—'}</span>
      </div>`;}).join('')}</div>

    <h2 class="sec">最近測驗紀錄</h2>
    <div class="card">${P.log.length ? P.log.slice(0,10).map(l=>`
      <div class="row" style="cursor:default">
        <span class="t"><b>${esc(l.name)}</b><span>${fmtDate(l.ts)}</span></span>
        <span style="font-weight:700;color:${l.score>=PASS?'var(--ok)':'var(--warn)'}">${l.score}分</span>
      </div>`).join('') : `<div class="empty">還沒有測驗紀錄</div>`}</div>

    <h2 class="sec">學習紀錄</h2>
    <button class="btn ghost" onclick="printRecord()">🖨️ 列印／存成 PDF 學習紀錄</button>
    <button class="btn gray" onclick="exportJSON()">💾 匯出進度檔（換手機用）</button>
    <button class="btn gray" onclick="$('#importFile').click()">📂 匯入進度檔</button>
    <input type="file" id="importFile" accept="application/json,.json" hidden onchange="importJSON(this)">
    <button class="btn gray" style="color:var(--warn);border-color:var(--warn)" onclick="clearAll()">🗑️ 清除本機所有紀錄</button>

    <div class="disclaimer">
      版本 1.0 · 天晟醫院急診部<br>
      所有學習紀錄僅存於本裝置，不會上傳雲端，也不含任何病人資料。
    </div>`;
}

function printRecord(){
  const chs = allChapters();
  const done = chs.filter(c=>P.read[c.id]).length;
  const w = window.open('', '_blank');
  if (!w) return toast('瀏覽器阻擋了新視窗，請允許彈出視窗');
  w.document.write(`<!DOCTYPE html><html lang="zh-Hant"><head><meta charset="utf-8"><title>學習紀錄</title>
    <style>body{font-family:"Microsoft JhengHei","PingFang TC",sans-serif;padding:32px;color:#111;line-height:1.7}
    h1{font-size:20px;border-bottom:2px solid #0d9488;padding-bottom:8px}
    table{border-collapse:collapse;width:100%;font-size:13px;margin-top:12px}
    th,td{border:1px solid #ccc;padding:6px 9px;text-align:left}
    th{background:#e6fffb} .s{font-size:12px;color:#666}</style></head><body>
    <h1>天晟醫院急診部　教學平台學習紀錄</h1>
    <p><b>姓名：</b>${esc(P.name||'（未填寫）')}　　<b>列印日期：</b>${fmtDate(Date.now())}<br>
    <b>教材完成：</b>${done} / ${chs.length} 章（${chs.length?Math.round(done/chs.length*100):0}%）</p>
    <table><thead><tr><th>課程</th><th>章節</th><th>讀完日期</th><th>測驗最佳成績</th></tr></thead><tbody>
    ${chs.map(c=>{const r=P.quiz[c.id];return `<tr><td>${esc(c.cat)}</td><td>${esc(c.title)}</td>
      <td>${P.read[c.id]?fmtDate(P.read[c.id]):'—'}</td><td>${r?r.best+' 分':'—'}</td></tr>`;}).join('')}
    </tbody></table>
    <p class="s">本紀錄由學員裝置本機資料產生，僅供單位教學訓練追蹤參考。</p>
    </body></html>`);
  w.document.close();
  setTimeout(()=>w.print(), 400);
}
function exportJSON(){
  const blob = new Blob([JSON.stringify(P,null,2)], {type:'application/json'});
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = `急診教學進度_${(P.name||'學員')}_${new Date().toISOString().slice(0,10)}.json`;
  a.click(); URL.revokeObjectURL(a.href);
  toast('已匯出進度檔');
}
function importJSON(input){
  const f = input.files && input.files[0]; if (!f) return;
  const fr = new FileReader();
  fr.onload = () => {
    try{
      const d = JSON.parse(fr.result);
      if (typeof d !== 'object' || !d) throw 0;
      if (!confirm('匯入後會覆蓋這台裝置目前的學習紀錄，確定嗎？')) return;
      P = Object.assign(blank(), d); save(); drawMe(); toast('已匯入進度');
    }catch(e){ toast('檔案格式不正確'); }
    input.value = '';
  };
  fr.readAsText(f);
}
function clearAll(){
  if (!confirm('將清除本機所有已讀章節、測驗成績與錯題紀錄。\n此動作無法復原，確定嗎？')) return;
  if (!confirm('再次確認：真的要清除全部學習紀錄嗎？')) return;
  P = blank(); save(); drawMe(); toast('已清除');
}

/* =====================================================================
   PWA 安裝與 Service Worker
   ===================================================================== */
let deferredPrompt = null;
window.addEventListener('beforeinstallprompt', e => {
  e.preventDefault(); deferredPrompt = e; $('#installBtn').hidden = false;
});
function doInstall(){
  if (!deferredPrompt){
    return alert('若要安裝到手機主畫面：\n\n・Android Chrome：右上角選單 →「安裝應用程式／加到主畫面」\n・iPhone Safari：下方分享鍵 →「加入主畫面」');
  }
  deferredPrompt.prompt();
  deferredPrompt.userChoice.finally(()=>{ deferredPrompt = null; $('#installBtn').hidden = true; });
}
window.addEventListener('appinstalled', ()=>{ $('#installBtn').hidden = true; toast('已安裝到主畫面 🎉'); });

if ('serviceWorker' in navigator && location.protocol.startsWith('http')){
  window.addEventListener('load', ()=> navigator.serviceWorker.register('sw.js').catch(e=>console.warn('SW 註冊失敗', e)));
}
/* iOS Safari 沒有 beforeinstallprompt，仍顯示按鈕給說明 */
if (/iPad|iPhone|iPod/.test(navigator.userAgent) && !navigator.standalone) $('#installBtn').hidden = false;

/* 手機返回鍵 */
window.addEventListener('popstate', ()=>{ if (stack.length){ goBack(); history.pushState(null,''); } });
history.pushState(null,'');

/* 啟動 */
tab('learn');
</script>
</body>
